<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>CiccaHelper – Web Preventivi</title>
  <link rel="stylesheet" href="style.css" />

  <!-- jsPDF per PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
  <div class="container">
    <h1>CiccaHelper – Preventivi materiali edili</h1>

    <!-- HEADER -->
    <section class="header-section">
      <div class="field">
        <label for="cliente">Cliente</label>
        <input id="cliente" type="text" placeholder="Es. Impresa Rossi Srl" />
      </div>

      <div class="field">
        <label for="data">Data</label>
        <input id="data" type="date" />
      </div>

      <div class="field full">
        <label for="note">Note preventivo</label>
        <textarea id="note" rows="2"
          placeholder="Es. Consegna a piano strada inclusa..."></textarea>
      </div>
    </section>

    <!-- TABELLA PREVENTIVO -->
    <section class="table-section">
      <h2>Righe preventivo</h2>

      <div class="new-row">
        <input id="codice" placeholder="Codice" />
        <input id="descrizione" placeholder="Descrizione" />
        <input id="quantita" type="number" step="0.01" placeholder="Q.tà" />
        <input id="prezzo_listino" type="number" step="0.01" placeholder="Prezzo listino" />
        <input id="sconto" type="number" step="0.01" placeholder="Sconto %" />
        <input id="iva" type="number" step="0.01" value="22" placeholder="IVA %" />
        <button id="btn-add-row">+ Aggiungi</button>
      </div>

      <table id="righe-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Codice</th>
            <th>Descrizione</th>
            <th>Q.tà</th>
            <th>Listino</th>
            <th>Sconto %</th>
            <th>Netto</th>
            <th>Totale riga</th>
            <th>IVA %</th>
            <th>Azioni</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div class="totali">
        <div><strong>Imponibile totale:</strong> <span id="imponibile-tot">0,00 €</span></div>
        <div><strong>IVA totale:</strong> <span id="iva-tot">0,00 €</span></div>
        <div><strong>Totale preventivo:</strong> <span id="totale-preventivo">0,00 €</span></div>
      </div>
    </section>

    <!-- AZIONI -->
    <section class="actions">
      <button id="btn-nuovo">Nuovo preventivo</button>
      <button id="btn-pdf">Esporta PDF</button>

      <button id="btn-ai" style="
        background:#0077ff;
        color:white;
        border:none;
        padding:8px 16px;
        border-radius:8px;
        cursor:pointer;">
        Genera con AI
      </button>
    </section>

    <!-- RISULTATO AI PREVENTIVO -->
    <div id="risultatoAI" style="
      display:none;
      white-space:pre-wrap;
      background:#f7f7f7;
      padding:15px;
      border-radius:10px;
      margin-top:20px;
      border:1px solid #ddd;">
    </div>

    <!-- CHIEDI A AI -->
    <div id="askAIBox" style="margin-top:18px;">
      <h2>Chiedi a AI</h2>

      <textarea id="ai-domanda" rows="3"
        placeholder="Scrivi una domanda..."
        style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd;">
      </textarea>

      <div style="display:flex; gap:10px; margin-top:10px;">
        <button id="btn-ask-ai">Invia domanda</button>
        <button id="btn-clear-ai">Pulisci</button>
      </div>

      <div id="ai-risposta" style="
        display:none;
        white-space:pre-wrap;
        background:#f7f7f7;
        padding:15px;
        border-radius:10px;
        margin-top:12px;
        border:1px solid #ddd;">
      </div>
    </div>
  </div>

  <!-- 🔐 MODAL PASSWORD (NASCONDE I CARATTERI) -->
  <div id="passwordModal" style="
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;">
    
    <div style="
      background:white;
      padding:20px;
      border-radius:12px;
      width:90%;
      max-width:320px;">
      
      <h3>Accesso riservato</h3>

      <input
        id="passwordInput"
        type="password"
        placeholder="Inserisci password"
        style="width:100%; padding:10px; font-size:16px; margin-bottom:12px;" />

      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button onclick="closePasswordModal()">Annulla</button>
        <button onclick="submitPassword()">OK</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script src="app.js"></script>
</body>
</html>
